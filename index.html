</style></head><body><div class="wrap"><header class="top"><div><h1>🌻 과학 정원 지키기!</h1><div class="sub">3학년 과학 · 지구와 바다 · 혼자서 즐기는 복습 디펜스</div></div><div class="stats"><div class="stat">☀️ <span id="sun">150</span></div><div class="stat">❤️ <span id="lives">5</span></div><div class="stat">⭐ <span id="score">0</span></div></div></header><main class="layout"><aside class="sidebar" id="plants"></aside><section class="panel"><div class="stagehead"><div><strong id="stageTitle">1단계 · 지구를 둘러싼 대기</strong><div class="small" id="status">시작 버튼을 눌러주세요.</div></div><button class="primary" id="quizBtn">📘 과학 문제 풀기 (+50 ☀️)</button></div><div class="progress"><div id="progress"></div></div><div class="boardbox" style="margin-top:10px"><div class="board" id="board"><div class="gridline" id="grid"></div></div></div><div class="footer"><button class="secondary" id="startBtn">▶ 게임 시작</button><button class="secondary" id="pauseBtn">⏸ 일시정지</button><button class="secondary" id="restartBtn">↻ 처음부터</button><button class="secondary" id="resetProgress" title="이 기기의 최고 기록을 지웁니다">기록 초기화</button><label class="small"><input type="checkbox" id="sound" checked> 효과음</label><span class="small" id="feedback">식물을 고르고 잔디밭을 누르면 심을 수 있어요.</span></div><div id="studyPanel" role="status"><strong>📚 오늘의 복습</strong> · 문제를 풀고 과학 지식을 모아 보세요! <span id="bestRecord"></span></div><p class="hint">🌻 태양꽃은 태양을 만들고, 🌱 콩 발사기는 좀비를 공격해요. 과학 문제를 풀어 태양을 얻으세요! 문제를 푸는 동안에는 게임이 멈춰요. 틀린 문제도 다시 공부할 수 있어요.</p></section></main></div><div class="overlay" id="overlay"><div class="modal" id="modal"></div></div><script>

const STAGE_SCENES=[
`<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#79cdf5"/><stop offset="1" stop-color="#e9f8ff"/></linearGradient></defs><rect width="640" height="220" fill="url(#sky)"/><circle cx="535" cy="45" r="29" fill="#ffdd61"/><g fill="#fff" opacity=".95"><ellipse cx="105" cy="62" rx="75" ry="23"/><ellipse cx="150" cy="52" rx="45" ry="29"/><ellipse cx="420" cy="105" rx="80" ry="21"/></g><path d="M0 186 Q160 156 320 184 T640 182 V220 H0Z" fill="#9dd27b"/><path d="M200 124 Q240 105 275 124" fill="none" stroke="#317db8" stroke-width="6" stroke-linecap="round"/><path d="M263 110 L280 126 L259 136" fill="none" stroke="#317db8" stroke-width="6" stroke-linecap="round"/><path d="M290 154 Q335 130 380 150" fill="none" stroke="#317db8" stroke-width="6" stroke-linecap="round"/><text x="22" y="205" font-size="21" fill="#2c603b" font-weight="bold">우리 주변에는 보이지 않는 공기가 있어요!</text>`,
`<rect width="640" height="220" fill="#b8e9ff"/><circle cx="565" cy="37" r="28" fill="#ffda62"/><path d="M0 177 L130 42 L235 174 L344 65 L469 175 L640 110 V220 H0Z" fill="#88b48b"/><path d="M80 98 L130 42 L180 98" fill="#fff"/><path d="M308 110 L344 65 L379 112" fill="#fff"/><path d="M0 181 Q160 155 325 189 T640 176 V220 H0Z" fill="#80c76d"/><path d="M365 220 Q335 170 440 135 T620 135" fill="none" stroke="#5cb6ec" stroke-width="35"/><path d="M365 220 Q335 170 440 135 T620 135" fill="none" stroke="#c2ecff" stroke-width="4"/><text x="20" y="208" font-size="22" font-weight="bold" fill="#285e35">산 · 들 · 강 · 호수</text>`,
`<rect width="640" height="220" fill="#e9f9ff"/><circle cx="320" cy="109" r="99" fill="#59baf0" stroke="#2b83b6" stroke-width="5"/><path d="M269 20 L324 30 L341 58 L311 81 L329 111 L294 130 L264 115 L247 73Z" fill="#8cce78"/><path d="M358 102 L403 91 L418 120 L394 156 L376 187 L352 164 L365 135Z" fill="#8cce78"/><path d="M266 150 L291 140 L316 171 L293 199 L265 187Z" fill="#8cce78"/><text x="20" y="48" font-size="26" fill="#467a40" font-weight="bold">육지</text><path d="M88 55 L254 88" stroke="#467a40" stroke-width="4"/><text x="515" y="48" font-size="26" fill="#1875b2" font-weight="bold">바다</text><path d="M514 56 L390 75" stroke="#1875b2" stroke-width="4"/><text x="24" y="206" font-size="19" fill="#376878">지구에는 육지보다 바다가 더 넓어요.</text>`,
`<rect width="640" height="220" fill="#e6f9fc"/><path d="M0 185 Q130 155 270 186 T640 186 V220 H0Z" fill="#b6e7b2"/><g transform="translate(135 36)"><path d="M-65 42 H65 L46 150 H-46Z" fill="#bfe9f9" stroke="#6b9ba8" stroke-width="5"/><path d="M-57 77 H57 L44 145 H-44Z" fill="#69bfe4"/><text x="0" y="187" text-anchor="middle" font-size="24" fill="#2d667f" font-weight="bold">바닷물</text></g><g transform="translate(475 36)"><path d="M-65 42 H65 L46 150 H-46Z" fill="#d8f6ff" stroke="#6b9ba8" stroke-width="5"/><path d="M-57 77 H57 L44 145 H-44Z" fill="#95d7f1"/><text x="0" y="187" text-anchor="middle" font-size="24" fill="#2d667f" font-weight="bold">육지의 물</text></g><g fill="#fff" stroke="#c2d3d6" stroke-width="2"><circle cx="110" cy="128" r="5"/><circle cx="143" cy="147" r="5"/><circle cx="168" cy="113" r="5"/></g>`,
`<rect width="640" height="220" fill="#a9e3fc"/><path d="M0 106 Q180 95 355 112 T640 104 V220 H0Z" fill="#60c6ed"/><path d="M0 138 Q145 118 245 146 T475 135 T640 146" fill="none" stroke="#fff" stroke-width="5" opacity=".8"/><path d="M0 174 Q145 141 287 178 L365 220 H0Z" fill="#f2d18e"/><path d="M455 15 L640 15 V220 H532 L518 145 L472 130 L490 85Z" fill="#a6a099"/><path d="M490 85 L640 84 V116 H478Z" fill="#d0b8a0"/><path d="M528 180 Q546 143 582 157 L610 220 H528Z" fill="#4b5457"/><path d="M543 182 Q562 163 580 175 L589 220 H542Z" fill="#253e4c"/><text x="24" y="38" font-size="25" fill="#245b77" font-weight="bold">모래 해변</text><text x="503" y="38" font-size="22" fill="#354b56" font-weight="bold">절벽</text><text x="530" y="206" font-size="19" fill="white" font-weight="bold">동굴</text>`
];
function questionArt(q){const n=Number(q.stage)-1;return `<svg class="quiz-art" viewBox="0 0 640 220" role="img" aria-label="${['대기와 바람','산과 강','육지와 바다가 보이는 지구','바닷물과 육지의 물 비교','해변과 절벽과 동굴'][n]||'과학 그림'}" xmlns="http://www.w3.org/2000/svg">${STAGE_SCENES[n]||STAGE_SCENES[0]}</svg>`}
function updateRecord(){try{let d=JSON.parse(localStorage.getItem('scienceGardenBest')||'{}');$('bestRecord').textContent=d.score?`🏅 이 기기의 최고 점수 ${d.score}점 · 최고 단계 ${d.stage||1}`:''}catch(e){}}
function saveRecord(){try{let d=JSON.parse(localStorage.getItem('scienceGardenBest')||'{}');if(score>(d.score||0)||stage+1>(d.stage||0)){localStorage.setItem('scienceGardenBest',JSON.stringify({score:Math.max(score,d.score||0),stage:Math.max(stage+1,d.stage||0)}))}updateRecord()}catch(e){}}

const STAGES=['지구를 둘러싼 대기','지구 표면의 여러 모습','육지와 바다','바닷물과 육지의 물','바닷가의 여러 지형'];
const PLANTS=[{id:'sun',name:'태양꽃',cost:50,hp:95,desc:'12초마다 태양 +25'},{id:'pea',name:'콩 발사기',cost:100,hp:100,desc:'콩알 공격'},{id:'wall',name:'튼튼 호두',cost:50,hp:430,desc:'좀비 길 막기'},{id:'ice',name:'얼음꽃',cost:125,hp:90,desc:'좀비 느리게'},{id:'cactus',name:'선인장',cost:150,hp:105,desc:'강한 공격'},{id:'fire',name:'불꽃 고추',cost:175,hp:80,desc:'빠른 불꽃 공격'}];
const ZS=[{id:'zombie',hp:120,speed:10},{id:'bucket',hp:240,speed:7}];
const $=id=>document.getElementById(id);let questions=[],state='menu',sun=150,lives=5,score=0,stage=0,elapsed=0,spawned=0,killed=0,plants=[],zombies=[],shots=[],selected='pea',last=0,quizOpen=false,quizCount=0,correct=0,wrong=0,asked=new Set(),activeQuestion=null,pausedFrom='playing',mowers=[true,true,true,true,true],particleId=0;
const stageDuration=80, spawnGoal=12;
function sprite(id,mode='idle'){return `assets/${id}_${mode}.png`}
function renderPlants(){ $('plants').innerHTML=PLANTS.map(p=>`<button class="plant ${selected===p.id?'sel':''}" data-plant="${p.id}"><img src="${sprite(p.id)}"><span>${p.name}<br><span class="small">☀️ ${p.cost}<br>${p.desc}</span></span></button>`).join('');document.querySelectorAll('[data-plant]').forEach(b=>b.onclick=()=>{selected=b.dataset.plant;renderPlants()})}
function ui(){ $('sun').textContent=sun;$('lives').textContent=lives;$('score').textContent=score;$('stageTitle').textContent=`${stage+1}단계 · ${STAGES[stage]}`;$('status').textContent=`좀비 ${killed}/${spawnGoal}마리 처치 · 문제 ${correct}개 정답`;$('progress').style.width=Math.min(100,elapsed/stageDuration*100)+'%';$('quizBtn').disabled=state!=='playing'||quizOpen; }
function sound(freq=500){if(!$('sound').checked)return;try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.13);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.13);setTimeout(()=>a.close(),300)}catch(e){}}
function modal(html){$('modal').innerHTML=html;$('overlay').classList.remove('hidden')}
function closeModal(){ $('overlay').classList.add('hidden') }
function intro(){modal(`<h2>🌎 과학 정원에 오신 걸 환영해요!</h2><p>지구와 바다에 관한 과학 문제를 풀고, 식물을 심어 좀비를 막아 보세요.</p><p><b>5개 단계 · 총 40개 복습 문제 · 혼자 플레이</b></p><p>정답 ☀️ +50 / 오답 ☀️ +15 (정답 설명 확인 후) · 문제를 풀 때 게임 정지</p><div class="choice"><button class="primary" onclick="startGame()">🌱 모험 시작!</button></div>`)}
function startGame(){quizOpen=false;activeQuestion=null;sun=150;lives=5;score=0;stage=0;quizCount=0;correct=0;wrong=0;asked=new Set();startStage();closeModal()}
function startStage(){plants=[];zombies=[];shots=[];elapsed=0;spawned=0;killed=0;mowers=[true,true,true,true,true];state='playing';sun=Math.max(sun,100);ui();draw();$('feedback').textContent='과학 문제를 풀고 태양을 모아 식물을 심으세요!'}
function pause(){if(quizOpen)return;if(state==='playing'){state='paused';$('pauseBtn').textContent='▶ 계속하기'}else if(state==='paused'){state='playing';$('pauseBtn').textContent='⏸ 일시정지'}}
function nextStage(){saveRecord();if(stage===4){state='won';modal(`<h2>🏆 과학 정원 지키기 성공!</h2><p>모든 바닷가 지형까지 복습했어요. 정말 멋져요!</p><p>⭐ 점수 ${score} · 정답 ${correct}개 · 오답 ${wrong}개</p><button class="primary" onclick="startGame()">다시 도전하기</button>`);return}stage++;sun+=100;startStage();modal(`<h2>🎉 ${stage}단계 통과!</h2><p>다음은 <b>${STAGES[stage]}</b>에 대해 알아볼 거예요.</p><p>새 단계 보너스: ☀️ +100</p><button class="primary" onclick="closeModal()">다음 단계 시작!</button>`)}
function quiz(){if(state!=='playing'||quizOpen)return;quizOpen=true;const pool=questions.filter(q=>q.stage===stage+1);let candidates=pool.filter(q=>!asked.has(questions.indexOf(q)));if(!candidates.length){pool.forEach(q=>asked.delete(questions.indexOf(q)));candidates=pool}activeQuestion=candidates[Math.floor(Math.random()*candidates.length)];asked.add(questions.indexOf(activeQuestion));modal(`<h2>🔍 과학 탐험 퀴즈</h2><p class="small">${stage+1}단계 · ${STAGES[stage]}</p>${questionArt(activeQuestion)}<h3>${activeQuestion.q}</h3><div class="answers">${activeQuestion.options.map((o,i)=>`<button class="answer" data-a="${i}">${i+1}. ${o}</button>`).join('')}</div><div id="result"></div>`);document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>answer(+b.dataset.a))}
function answer(n){if(!quizOpen||!activeQuestion||$('result').dataset.done)return;const good=n===activeQuestion.answer;good?(sun+=50,correct++,score+=100,sound(700)):(sun+=15,wrong++,sound(250));quizCount++;document.querySelectorAll('[data-a]').forEach(b=>{b.disabled=true;if(+b.dataset.a===activeQuestion.answer)b.classList.add('correct');else if(+b.dataset.a===n)b.classList.add('wrong')});$('result').dataset.done='1';$('result').innerHTML=`<div class="explain"><b>${good?'🎉 정답이에요! ☀️ +50':'🌱 괜찮아요! 정답은 '+(activeQuestion.answer+1)+'번이에요. ☀️ +15'}</b><p>${activeQuestion.explain}</p></div><button class="primary" style="margin-top:12px;width:100%" id="continue">정원으로 돌아가기</button>`;$('continue').onclick=()=>{quizOpen=false;activeQuestion=null;closeModal();ui()}}
function plantAt(x,y){if(state!=='playing'||quizOpen||!$('overlay').classList.contains('hidden'))return;const col=Math.floor(x*9),row=Math.floor(y*5);if(col<0||col>8||row<0||row>4)return;const p=PLANTS.find(p=>p.id===selected);if(plants.some(t=>t.col===col&&t.row===row)){$('feedback').textContent='이미 식물이 심어져 있어요.';return}if(sun<p.cost){$('feedback').textContent='태양이 부족해요! 과학 문제를 풀어 보세요.';return}sun-=p.cost;plants.push({id:p.id,col,row,hp:p.hp,max:p.hp,cool:0,age:0,anim:0});sound(450);ui();draw()}
function spawn(){const z=ZS[stage>=2&&Math.random()<.25+stage*.06?1:0],row=Math.floor(Math.random()*5);zombies.push({id:z.id,x:9.1,row,hp:z.hp+stage*22,max:z.hp+stage*22,speed:z.speed+stage*.7,slow:0,bite:0,hurt:0});spawned++}
function tick(dt){for(const p of plants)p.anim=Math.max(0,p.anim-dt);for(const z of zombies)z.bite=Math.max(0,z.bite-dt);if(state!=='playing'||quizOpen||!$('overlay').classList.contains('hidden'))return;elapsed+=dt;let next=3.8+elapsed*.0-stage*.25;if(spawned<spawnGoal&&elapsed>2&&elapsed>=spawned*Math.max(3.3,next)+2)spawn();for(const p of plants){p.age+=dt;p.cool-=dt;if(p.id==='sun'&&p.age>=12){sun+=25;p.age=0;floatText(p.col,p.row,'☀️ +25')}if(p.id==='wall'||p.id==='sun')continue;const target=zombies.filter(z=>z.row===p.row&&z.x>p.col+.25).sort((a,b)=>a.x-b.x)[0];const interval=p.id==='fire'?.9:p.id==='cactus'?1.7:1.45;if(target&&p.cool<=0){shots.push({x:p.col+.8,row:p.row,speed:p.id==='fire'?5.4:4.4,damage:p.id==='cactus'?42:p.id==='fire'?28:26,ice:p.id==='ice',fire:p.id==='fire'});p.cool=interval;p.anim=.25}}for(const s of shots){s.x+=s.speed*dt;const hit=zombies.find(z=>z.row===s.row&&Math.abs(z.x-s.x)<.35);if(hit){hit.hp-=s.damage;hit.hurt=.25;if(s.ice)hit.slow=3;if(s.fire)hit.hp-=6;s.dead=true;if(hit.hp<=0){zombies.splice(zombies.indexOf(hit),1);killed++;score+=20;floatText(Math.min(8,hit.x),hit.row,'+20')}}}shots=shots.filter(s=>!s.dead&&s.x<9.5);for(const z of zombies){z.slow=Math.max(0,z.slow-dt);z.hurt=Math.max(0,z.hurt-dt);const block=plants.find(p=>p.row===z.row&&Math.abs(z.x-(p.col+.5))<.5);if(block){block.hp-=dt*19;z.bite=.3;if(block.hp<=0)plants.splice(plants.indexOf(block),1)}else z.x-=z.speed*dt/60*(z.slow? .45:1);if(z.x<0){if(mowers[z.row]){mowers[z.row]=false;zombies.filter(a=>a.row===z.row).forEach(a=>{a.hp=0;killed++});zombies=zombies.filter(a=>a.row!==z.row);floatText(.3,z.row,'🚜 방어!')}else{zombies.splice(zombies.indexOf(z),1);lives--;sound(180);if(lives<=0){state='lost';saveRecord();modal(`<h2>😵 정원이 위험해요!</h2><p>${stage+1}단계에서 좀비를 막지 못했어요.</p><p>⭐ ${score}점 · 정답 ${correct}개</p><button class="primary" onclick="startGame()">처음부터 다시 도전</button>`);break}}}}if(spawned>=spawnGoal&&zombies.length===0&&state==='playing'){state='clear';nextStage()}ui()}
function floatText(x,row,txt){const el=document.createElement('div');el.className='float';el.textContent=txt;el.style.left=(x+.2)*100/9+'%';el.style.top=(row+.3)*20+'%';$('board').appendChild(el);setTimeout(()=>el.remove(),750)}
// Keep sprite elements alive across frames to avoid flicker and image reloads.
const unitNodes=new WeakMap(), shotNodes=new WeakMap(), mowerNodes=[];
const preloadedSprites=[];
function preloadSprites(){
  for(const id of [...PLANTS.map(p=>p.id),...ZS.map(z=>z.id)]){
    for(const mode of ['idle','attack','hurt']){
      const im=new Image();im.decoding='async';im.src=sprite(id,mode);preloadedSprites.push(im);
    }
  }
}
function createUnit(obj,kind){
  const el=document.createElement('div');el.className='unit'+(kind==='zombie'?' zombie':'');
  const hp=document.createElement('div');hp.className='hp';
  const bar=document.createElement('i');hp.appendChild(bar);el.appendChild(hp);
  $('board').appendChild(el);unitNodes.set(obj,el);return el;
}
function draw(){
  const b=$('board');
  for(let r=0;r<5;r++){
    if(!mowerNodes[r]){const el=document.createElement('div');el.className='lawnmower';el.style.top=(r*20+3.5)+'%';b.appendChild(el);mowerNodes[r]=el;}
    mowerNodes[r].style.display=mowers[r]?'':'none';
  }
  const alive=new Set();
  for(const p of plants){
    let el=unitNodes.get(p);if(!el)el=createUnit(p,'plant');alive.add(el);
    el.style.left=p.col*100/9+'%';el.style.top=p.row*20+'%';
    const mode=p.anim>0?'attack':'idle';
    if(el.dataset.mode!==mode){el.style.backgroundImage=`url("${sprite(p.id,mode)}")`;el.dataset.mode=mode;}
    el.style.backgroundPosition=`${(Math.floor(performance.now()/145)%6)*20}% 0`;
    el.firstChild.firstChild.style.width=Math.max(0,p.hp/p.max*100)+'%';
  }
  for(const z of zombies){
    let el=unitNodes.get(z);if(!el)el=createUnit(z,'zombie');alive.add(el);
    el.style.left=z.x*100/9+'%';el.style.top=z.row*20+'%';
    const mode=z.hurt>0?'hurt':z.bite>0?'attack':'idle';
    if(el.dataset.mode!==mode){el.style.backgroundImage=`url("${sprite(z.id,mode)}")`;el.dataset.mode=mode;}
    el.style.backgroundPosition=`${(Math.floor(performance.now()/150)%6)*20}% 0`;
    el.style.filter=z.slow?'drop-shadow(0 0 7px #38b9ff)':'';
    el.firstChild.firstChild.style.width=Math.max(0,z.hp/z.max*100)+'%';
  }
  for(const sh of shots){
    let el=shotNodes.get(sh);
    if(!el){el=document.createElement('div');el.className='projectile';b.appendChild(el);shotNodes.set(sh,el);}
    alive.add(el);el.style.left=sh.x*100/9+'%';el.style.top=(sh.row+.42)*20+'%';
    el.style.background=sh.ice?'#8be4fa':sh.fire?'#fa8933':'';
  }
  b.querySelectorAll('.unit,.projectile').forEach(el=>{if(!alive.has(el))el.remove()});
}
$('board').onclick=e=>{const r=$('board').getBoundingClientRect();plantAt((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)};$('quizBtn').onclick=quiz;$('startBtn').onclick=()=>{if(state==='menu'||state==='lost'||state==='won')startGame();else if(state==='paused')pause()};$('pauseBtn').onclick=pause;$('restartBtn').onclick=()=>{state='menu';intro()};$('resetProgress').onclick=()=>{if(confirm('이 기기에 저장된 최고 기록을 지울까요?')){localStorage.removeItem('scienceGardenBest');updateRecord()}};updateRecord();for(let i=0;i<45;i++){const el=document.createElement('div');$('grid').appendChild(el)};
preloadSprites();fetch('questions.json').then(r=>r.json()).then(q=>{questions=q;renderPlants();ui();intro()}).catch(()=>{modal('<h2>파일을 불러오지 못했어요.</h2><p>이 게임은 ZIP을 풀고 서버에서 실행해야 합니다. README를 확인해 주세요.</p>')});let lastDraw=0;function frame(t){if(last){let dt=Math.min((t-last)/1000,.05);tick(dt)}last=t;if(t-lastDraw>=33){draw();lastDraw=t}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
